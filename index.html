<style>
.pwa-tools {
  --pwa-tint: #ffe4ef; --pwa-accent: #843861; --pwa-edge: #efaece;
  position: relative; flex: 0 0 100%; margin-top: 8px; color: var(--pwa-accent); text-align: left;
}
.pwa-tools summary {
  display: flex; align-items: center; gap: 7px; width: fit-content; min-height: 46px;
  margin-left: 0; padding: 6px 13px; border: 2px solid var(--pwa-edge);
  border-radius: 999px; background: var(--pwa-tint); box-shadow: 0 3px 0 var(--pwa-edge);
  cursor: pointer; font-weight: 800; list-style: none;
}
.pwa-tools summary::-webkit-details-marker { display: none; }
.pwa-tools .pwa-chevron { font-size: .8em; }
.pwa-tools[open] .pwa-chevron { transform: rotate(180deg); }
.pwa-tools .pwa-panel {
  position: absolute; bottom: calc(100% + 11px); right: 0;
  width: min(310px, calc(100vw - 30px)); max-height: min(420px, 68dvh); overflow: auto;
  padding: 14px; border: 2px solid var(--pwa-edge); border-radius: 22px;
  background: #fffdfb; box-shadow: 0 8px 25px #38242b25;
}
.pwa-tools .pwa-heading { display: block; margin: 0 0 8px; font-size: 1rem; font-weight: 850; }
.pwa-tools button {
  display: block; width: 100%; min-height: 44px; margin: 0 0 6px; padding: 6px 10px;
  border: 1px solid var(--pwa-edge); border-radius: 13px; background: var(--pwa-tint);
  color: var(--pwa-accent); font: inherit; font-weight: 750; cursor: pointer;
}
.pwa-tools #pwa-save { background: #fff6d9; border-color: #ead58c; color: #634b1d; }
.pwa-tools button:disabled { cursor: default; opacity: .65; }
.pwa-tools [hidden], .pwa-tools p:empty { display: none; }
.pwa-tools p { margin: 7px 0 0; font-size: .9rem; line-height: 1.5; }
html:lang(ja) .pwa-en, html:not(:lang(ja)) .pwa-ja { display: none; }
</style>
</head>
