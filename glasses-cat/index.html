<body data-game="cats">
<main data-board-layout data-game-toolbar>
<div class="game-sidebar">
<header class="game-heading game-title-banner"><span class="game-title-rainbow" aria-hidden="true">🌈</span>
    <span class="game-title-art" aria-hidden="true"></span>
    <h1 data-ja="メガネ猫さがし">Find the Glasses Cat</h1></header>
<div class="cat-example game-guide" id="cat-example"><strong data-ja="メガネを かけた ねこを タップ！">Tap the cats wearing glasses!</strong></div>
<section class="score-board" aria-labelledby="board-title">
<div class="score-board-heading">
<h2 id="board-title"><img src="../assets/game-cat.png" alt="" width="38" height="38"><span data-ja="ランキング">Leaderboard</span></h2>
<div class="score-period" aria-label="Ranking period" role="group">
<button type="button" data-period="weekly" aria-pressed="true" data-ja="今週">This week</button>
<button type="button" data-period="all" aria-pressed="false" data-ja="すべて">All time</button>
</div>
</div>
<p class="personal-best" id="personal-best"></p>
<ol id="score-list"></ol>
</section>
</div>
<div class="play-stack">
  <div class="play-hud"><div class="stats"><span><img class="stat-icon" src="../assets/game-cat.png" alt=""> <output id="score">0</output><span data-ja=" ひき みつけた"> found</span></span><span><output id="time">30s left</output></span></div>
</div>
<div class="play-stage">
<div class="cat-grid game-field" id="cats" aria-label="Cats"></div>
<div class="game-card" id="ready-card">
<img src="../assets/game-cat.png" alt="" width="72" height="72">
<strong data-ja="はじめよう！">Ready to play?</strong>
<div class="player-setup"><label for="nickname" data-ja="ニックネーム">Your nickname?</label><input id="nickname" maxlength="20" placeholder="e.g. Mochi" data-ja-placeholder="例：もち" autocomplete="off" aria-describedby="player-hint"><small id="player-hint" data-ja="ニックネームは任意です。保存すると、この端末にスコアが残ります。">A nickname is optional. Add one to save your score on this device.</small></div>
</div>
</div>
<div class="game-card" id="score-card" role="status" aria-atomic="true" hidden>
<span data-ja="スコア">Final score</span><strong id="final-score"></strong><p></p>
</div>
<button class="change-player" id="change-player" type="button" hidden data-ja="ニックネームをかえる">Change nickname</button>
<div class="play-row"><button class="play-primary" id="play" type="button">Play</button><button class="stop-button" id="stop" type="button" hidden data-ja="■ ストップ">■ Stop</button></div>
<button id="practice" type="button" data-ja="れんしゅう">Practice</button>
<p id="result" role="status"></p>
</div>
<nav class="game-picker" data-game-catalog aria-label="More Momo games"></nav>
</main>
