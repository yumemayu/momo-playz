<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-en-title="Clicky Keys">カチカチキー</title>
<script defer src="../game-catalog.js"></script>
  <link rel="stylesheet" href="../language.css">
  <link rel="stylesheet" href="../game.css?v=level-cards">
  <link rel="stylesheet" href="../game-picker.css">
  <link rel="stylesheet" href="../toy-box/toys.css?v=space-wide2">
  <link rel="stylesheet" href="../game-title-banner.css">
  <link rel="stylesheet" href="layout.css">
  <script defer src="../language.js"></script>
<script defer src="../nickname.js?v=compact"></script>
<link rel="stylesheet" href="../nickname.css?v=compact">
  <script defer src="../stickers.js"></script>
  <script defer src="../toy-box/toys.js?v=animal-keys"></script>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#f272a7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Clicky Keys">
  <link rel="apple-touch-icon" href="../icons/icon-512.png">
  <script defer src="../pwa.js?v=sound-cue"></script>
</head>
<body data-game="clicky-keys">
<main class="clicky-keys-main" data-board-layout data-game-toolbar data-game-audio>
  <aside class="game-sidebar">
    <header class="game-heading game-title-banner">
    <span class="game-title-rainbow" aria-hidden="true">🌈</span>
    <span class="game-title-art" aria-hidden="true"></span>
    <h1><span data-ja="Momoのカチカチキーボード">Momo Clicky Keys</span></h1>
    </header>
    <div class="game-guide">
      <h2 data-ja="あそびかた">How to play</h2>
      <ol>
        <li data-ja="キーを押すと、カチッと音が鳴るよ。">Tap a key to hear it click.</li>
        <li data-ja="パソコンなら A〜Z とスペースキーも使えるよ。">On a computer, you can also use A–Z and Space.</li>
        <li data-ja="れんらくちょうで、ひみつの言葉を見つけよう。">Try typing a secret word in the notebook.</li>
      </ol>
    </div>
  </aside>
  <div class="play-stack">
  <section id="keys" class="toy play-stage" aria-label="Clicky Keys" data-ja-label="カチカチキー">
    <div class="keys-bar"><button type="button" id="keys-wide" aria-pressed="false">⛶ Bigger</button></div>
    <div class="choices" role="group" aria-label="Keyboard style" data-ja-label="キーボードの見た目">
      <button type="button" data-palette="choco" aria-pressed="true" data-ja="チョコミント">Choco Mint</button>
      <button type="button" data-palette="pastel" aria-pressed="false" data-ja="いちごミルク">Strawberry Milk</button>
      <button type="button" data-palette="cat" aria-pressed="false" data-ja="ねこキー">Cat Keys</button>
      <button type="button" data-palette="puppy" aria-pressed="false" data-ja="パピー">Puppy</button>
    </div>
    <div class="key-case" data-theme="choco">
      <div class="symbol-row" role="group" aria-label="Symbol keys" data-ja-label="マークキー">
        <button type="button" class="keycap symbol-key" data-color="1" data-glyph="⬆" style="color:#5b8dd9" aria-label="Up arrow">⬆</button>
        <button type="button" class="keycap symbol-key" data-color="2" data-glyph="⬅" style="color:#f2a93b" aria-label="Left arrow">⬅</button>
        <button type="button" class="keycap symbol-key" data-color="3" data-glyph="⬇" style="color:#e77cab" aria-label="Down arrow">⬇</button>
        <button type="button" class="keycap symbol-key" data-color="4" data-glyph="➡" style="color:#7bc47f" aria-label="Right arrow">➡</button>
        <button type="button" class="keycap symbol-key" data-color="5" data-glyph="♥" style="color:#e77cab" aria-label="Heart">♥</button>
        <button type="button" class="keycap symbol-key" data-color="6" data-glyph="★" style="color:#dba83f" aria-label="Star">★</button>
        <button type="button" class="keycap symbol-key" data-color="0" data-glyph="♪" style="color:#9a7bd9" aria-label="Music note">♪</button>
        <button type="button" class="keycap symbol-key" data-color="1" data-glyph="✿" style="color:#e77cab" aria-label="Flower">✿</button>
        <button type="button" class="keycap symbol-key" data-color="2" data-glyph="！" style="color:#ef6a5a" aria-label="Exclamation mark">！</button>
        <button type="button" class="keycap symbol-key" data-color="3" data-glyph="？" style="color:#5b8dd9" aria-label="Question mark">？</button>
      </div>
      <div id="key-grid" role="group" aria-label="Keyboard" data-ja-label="キーボード"></div>
      <div class="bottom-row"><span aria-hidden="true">✿</span><button type="button" class="space keycap" aria-label="Space" data-ja-label="スペースキー"><span class="key-art" data-art="flower" aria-hidden="true"></span><span class="key-art" data-art="strawberry" aria-hidden="true"></span><small id="space-word" aria-hidden="true">HAPPINESS</small><span class="key-art" data-art="bow" aria-hidden="true"></span><span class="key-art" data-art="heart" aria-hidden="true"></span></button><span aria-hidden="true">✦</span></div>
    </div>
    <div class="choices" role="group" aria-label="Key sound" data-ja-label="キーの音">
      <button type="button" data-sound="creamy" aria-pressed="true" data-ja="クリーミー">Creamy</button>
      <button type="button" data-sound="soft" aria-pressed="false" data-ja="やわらか">Soft</button>
      <button type="button" data-sound="cute" aria-pressed="false" data-ja="かわいい">Cute</button>
    </div>
    <div class="key-notebook">
      <div class="notebook-heading">
        <label for="key-note" data-ja="れんらくちょう">Notebook</label>
        <span id="momo-ribbon" class="momo-ribbon" hidden>
          <span class="key-art" data-art="bow" aria-hidden="true"></span>
          <span data-ja="リボンシール">Ribbon sticker</span>
        </span>
      </div>
      <textarea id="key-note" rows="2" readonly placeholder="What will you type?" data-ja-placeholder="キーをおすと ここにのこるよ"></textarea>
      <div class="choices">
        <button type="button" id="note-back" data-ja="１文字けす">Backspace</button>
        <button type="button" id="note-clear" data-ja="ぜんぶけす">Clear</button>
      </div>
      <div class="key-hint" id="key-hint"><span id="key-hint-text"></span><span id="key-secret-count" class="key-secret-count"></span></div>
    </div>
  </section>
<details class="momo-nickname-panel" data-nickname-panel>
  <summary>Set nickname</summary>
  <form>
    <label for="shared-nickname" data-ja="ニックネーム">Nickname</label>
    <input id="shared-nickname" maxlength="20" autocomplete="off">
    <button type="submit" data-ja="保存">Save</button>
  </form>
  <small role="status"></small>
</details>
  </div>
  <nav class="game-picker" data-game-catalog aria-label="More Momo games"></nav>
</main>
  <footer><a href="../sticker-book/" data-sticker-link>✦ Sticker Book</a>
<a href="https://clubs.place/f/fS6twrevaLxr9ZI38eKpOUpW" target="_blank" rel="noopener noreferrer" data-ja="感想をおくる">Send feedback</a></footer>
<span id="sticker-announcement" class="toy-sr-only" role="status"></span>
</body>
</html>
