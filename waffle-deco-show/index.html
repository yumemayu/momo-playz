<style>
:root{color-scheme:light;--ink:#6d382c;--pink:#b92256;--rose:#fdd9e4;--cream:#fff9ed}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:700 16px system-ui,sans-serif;background:#fff7ed}
main{max-width:1120px;margin:auto;padding:14px clamp(9px,2vw,24px)}
header,.toolbar,.actions,.modes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header{justify-content:space-between;margin-bottom:8px}
h1{margin:0;font-size:clamp(1.3rem,3vw,2.2rem);line-height:1.2;color:#713526}
h1 small{display:block;color:var(--pink);font-size:.75rem;letter-spacing:.08em;margin-bottom:3px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:1px solid #efb9c5;border-radius:13px;background:#fff8f0;min-height:42px;padding:7px 12px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,canvas:focus-visible{outline:3px solid #7d4c98;outline-offset:2px}
button[aria-pressed=true]{border:2px solid var(--pink);background:#ffe1eb}
.primary{background:var(--pink);color:white;border-color:var(--pink);padding-inline:16px;box-shadow:0 3px #881d41}
.stage{border:5px solid white;border-radius:23px;position:relative;overflow:hidden;background:#fff0ed;display:grid;justify-items:center;grid-template-columns:minmax(0,1fr)}
canvas{width:min(100%,64dvh);height:auto;aspect-ratio:1;max-width:100%;display:block;touch-action:none;cursor:crosshair}
.stage:has(.reveal:not([hidden])) canvas{cursor:default}
.reveal{grid-row:1;margin-block-start:8px;padding:6px 22px;background:#f9c4d4;border:2px solid #fff;border-radius:22px;color:#78274a;margin-inline:0;margin-bottom:0;font-size:clamp(1rem,3vw,1.6rem);pointer-events:none}
.toolbar{justify-content:space-between;margin:9px 0;min-height:42px}
.theme-card{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f6e7fa;border:1px solid #dab6e4;border-radius:14px;padding:4px 8px}.theme-card strong{font-size:.76rem;background:#78448a;color:white;padding:5px 8px;border-radius:8px}.theme-card button{min-height:34px;font-size:.78rem}
.size-tools{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:7px;font-size:.85rem;flex-wrap:wrap}.size-tools > div{display:flex;align-items:center;gap:6px}.size-tools input{width:min(45vw,210px);accent-color:var(--pink);min-height:36px;touch-action:pan-y}
#theme{color:#773f83;font-size:clamp(.86rem,2vw,1.12rem);margin:0}
.tray{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;padding:7px;background:#fad2df;border-radius:16px;margin-top:7px}
.tray button{display:grid;justify-items:center;align-content:center;gap:3px;padding:4px 1px;touch-action:none;min-width:0;font-size:clamp(.62rem,1.4vw,.84rem)}
.tray img{width:clamp(29px,5.5vw,64px);aspect-ratio:1;object-fit:contain;pointer-events:none}
.actions{justify-content:center;margin-top:8px}
#hint{min-height:1.4em;text-align:center;margin:8px 0 0;font-size:.82rem}
#home{display:inline-flex;align-items:center;min-height:42px;padding:0 10px;border-radius:13px;background:#fff8f0;border:1px solid #efb9c5;color:var(--ink);text-decoration:none;font-size:.8rem}footer{text-align:center;color:#804d48;font-size:.72rem;margin:10px 0}
[hidden]{display:none!important}
@media(max-width:480px){.tray{grid-template-columns:repeat(4,minmax(0,1fr))}.tray img{width:36px}main{padding-top:8px}}

function soundPop(){
 if(!sound)return;
 const Engine=window.AudioContext||window.webkitAudioContext;
 if(!Engine)return;
 try{
  audio ||= new Engine();audio.resume().catch(()=>{});
  const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;
  osc.frequency.setValueAtTime(520,t);osc.frequency.exponentialRampToValueAtTime(210,t+.12);
  gain.gain.setValueAtTime(.065,t);gain.gain.exponentialRampToValueAtTime(.001,t+.14);
  osc.connect(gain).connect(audio.destination);osc.start(t);osc.stop(t+.15);
 }catch{}
}

function drawArt(key,x,y,width,angle=0){
 const img=assets[key];
 if(!img?.complete||!img.naturalWidth)return;
 const scale=width/Math.max(img.naturalWidth,img.naturalHeight);
 const w=img.naturalWidth*scale,h=img.naturalHeight*scale;
 const turn=angle*Math.PI/180;
 const halfWidth=(w*Math.abs(Math.cos(turn))+h*Math.abs(Math.sin(turn)))/2;
 const halfHeight=(w*Math.abs(Math.sin(turn))+h*Math.abs(Math.cos(turn)))/2;
 ctx.save();
 ctx.translate(
  Math.min(size-halfWidth-8,Math.max(halfWidth+8,x)),
  Math.min(size-halfHeight-8,Math.max(halfHeight+8,y))
 );
 ctx.rotate(turn);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();
}
function render(confetti=0){

 drawWaffle();
 ctx.lineCap='round';ctx.lineJoin='round';
 for(const stroke of strokes){
  for(const [color,width] of [['#ab580f',19],['#e8a731',14],['#ffe391',5]]){
   ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;
   ctx.beginPath();ctx.moveTo(...stroke[0]);
   if(stroke.length===1){ctx.arc(stroke[0][0],stroke[0][1],width/2,0,Math.PI*2);ctx.fill();}
   else{for(const point of stroke.slice(1))ctx.lineTo(...point);ctx.stroke();}
  }
 }
 const popAge=pop?Math.min(1,(performance.now()-pop.start)/470):1;
 for(const piece of pieces){
  const bounce=piece.id===pop?.id?Math.sin(Math.PI*popAge)*Math.exp(-2*popAge):0;
  drawArt(piece.key,piece.x,piece.y-28*bounce,toppingSize[piece.key]*piece.scale*(1+.42*bounce),piece.angle);
 }
 if(pop&&!finished){
  ctx.save();ctx.globalAlpha=1-popAge;ctx.textAlign='center';ctx.font='bold 32px system-ui';ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.fillStyle='#b92256';
  const x=Math.max(70,Math.min(830,pop.x)),y=Math.max(40,pop.y-50-popAge*40);
  ctx.strokeText(words().pon,x,y);ctx.fillText(words().pon,x,y);
  for(let i=0;i<5;i++){
   const angle=i*Math.PI*2/5,radius=28+popAge*100;
   ctx.beginPath();ctx.ellipse(pop.x+Math.cos(angle)*radius,pop.y+Math.sin(angle)*radius,5,3,angle,0,Math.PI*2);ctx.fill();
  }

 }
 if(gesture?.kind==='new'&&gesture.inCanvas)drawArt(gesture.key,gesture.x,gesture.y,toppingSize[gesture.key]);

 }

  const colors=['#f38ab5','#ffc668','#bd9eeb','#b5cfa1'];

}
function onPlate({x,y}){return Math.hypot(x-450,y-450)<422;}
function clampToPlate(point){
 const dx=point.x-450,dy=point.y-450;const factor=Math.min(1,414/(Math.hypot(dx,dy)||1));
 return {x:450+dx*factor,y:450+dy*factor};
}
function checkpoint(){history.push({pieces:pieces.map(piece=>({...piece})),strokes:strokes.slice(),activePiece});}
function add(key,pos){if(!onPlate(pos))return;checkpoint();const piece={key,...pos,id:nextPieceId++,scale:1,angle:0};pieces.push(piece);activePiece=piece.id;animatePop(piece);}
for(const key of toppingKeys){
 const button=document.createElement('button');button.type='button';
 const img=document.createElement('img');img.src=art[key];img.alt='';
 button.append(img,document.createElement('span'));byId('tray').append(button);
 button.onclick=()=>{selection=key;update();};
 button.addEventListener('pointerdown',event=>{
  if(key==='syrup'||finished||gesture||event.button!==0)return;
  selection=key;cursor=null;update();
  gesture={kind:'new',key,id:event.pointerId,inCanvas:false};button.setPointerCapture(event.pointerId);
 });
 button.addEventListener('pointermove',event=>{
  if(gesture?.kind!=='new'||gesture.id!==event.pointerId)return;
  const pos=point(event);Object.assign(gesture,pos,{inCanvas:onPlate(pos)});render();
 });
 button.addEventListener('pointerup',event=>{
  if(gesture?.kind!=='new'||gesture.id!==event.pointerId)return;
  const pos=point(event);gesture=null;add(key,pos);update();render();
 });
 button.addEventListener('pointercancel',event=>{if(gesture?.id===event.pointerId){gesture=null;render();}});
}
canvas.addEventListener('pointerdown',event=>{
 if(finished||gesture||event.button!==0)return;
 const pos=point(event);if(!onPlate(pos))return;
 cursor=null;canvas.setPointerCapture(event.pointerId);
 if(selection==='syrup'){
  checkpoint();const path=[[pos.x,pos.y]];strokes.push(path);
  gesture={kind:'syrup',id:event.pointerId,path};
 }else{
  const piece=pieces.findLast(item=>Math.hypot(item.x-pos.x,item.y-pos.y)<toppingSize[item.key]*item.scale*.43);
  gesture={kind:'plate',id:event.pointerId,piece,origin:pos,moved:false};
 }
 render();
});
canvas.addEventListener('pointermove',event=>{
 if(!gesture||gesture.id!==event.pointerId)return;
 const pos=point(event);
 if(gesture.kind==='syrup'){
  const last=gesture.path.at(-1);
  if(onPlate(pos)&&Math.hypot(last[0]-pos.x,last[1]-pos.y)>4)gesture.path.push([pos.x,pos.y]);
 }else if(gesture.piece){
  if(!gesture.moved&&Math.hypot(pos.x-gesture.origin.x,pos.y-gesture.origin.y)>9){
   checkpoint();gesture.moved=true;pieces.splice(pieces.indexOf(gesture.piece),1);pieces.push(gesture.piece);
  }
  if(gesture.moved)Object.assign(gesture.piece,clampToPlate(pos));
 }
 render();
});
function endPlate(event){
 if(!gesture||gesture.id!==event.pointerId)return;
 if(event.type==='pointerup'&&gesture.kind==='plate'){
  if(gesture.piece)activePiece=gesture.piece.id;
  else if(!gesture.moved)add(selection,point(event));
 }
 gesture=null;update();render();
}
canvas.addEventListener('pointerup',endPlate);canvas.addEventListener('pointercancel',endPlate);
canvas.addEventListener('keydown',event=>{
 if(finished)return;
 const vectors={ArrowLeft:[-35,0],ArrowRight:[35,0],ArrowUp:[0,-35],ArrowDown:[0,35]};
 if(!vectors[event.key]&&event.key!=='Enter'&&event.key!==' ')return;
 event.preventDefault();cursor ||= {x:450,y:450};
 if(vectors[event.key]){
  const [dx,dy]=vectors[event.key];cursor=clampToPlate({x:cursor.x+dx,y:cursor.y+dy});
 }else if(selection==='syrup'){checkpoint();strokes.push([[cursor.x,cursor.y]]);}
 else add(selection,cursor);
 update();render();
});
canvas.addEventListener('blur',()=>{cursor=null;render();});
byId('undo').onclick=()=>{if(gesture||!history.length)return;cancelAnimationFrame(popFrame);pop=null;({pieces,strokes,activePiece}=history.pop());update();render();};
function bindAdjustment(name,property,factor,suffix){
 const input=byId('topping-'+name),output=byId(name+'-value');
 let adjustingId=null;
 input.addEventListener('input',()=>{
  const piece=active();if(!piece||finished)return;
  if(adjustingId!==piece.id){checkpoint();adjustingId=piece.id;}
  piece[property]=Number(input.value)/factor;
  output.textContent=input.value+suffix;byId('undo').disabled=false;render();
 });
 const end=()=>{adjustingId=null;};
 input.addEventListener('change',end);input.addEventListener('blur',end);
}
bindAdjustment('size','scale',100,'%');
bindAdjustment('angle','angle',1,'°');
byId('sound').onclick=()=>{sound=!sound;update();if(sound)soundPop();};
byId('language').onclick=()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('momo-language',lang);}catch{}update();};
byId('theme-mode').onclick=()=>{mode='theme';update();};
byId('free-mode').onclick=()=>{mode='free';update();};
byId('next-theme').onclick=()=>{theme=(theme+1)%words().themes.length;update();};
byId('finish').onclick=()=>{
 if(gesture)return;cancelAnimationFrame(popFrame);pop=null;finished=true;cursor=null;update();
 byId('photo').focus();
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){render();return;}
 const start=performance.now();
 const celebrate=now=>{const remaining=Math.max(0,1-(now-start)/1200);render(remaining);if(remaining)confettiFrame=requestAnimationFrame(celebrate);};
 confettiFrame=requestAnimationFrame(celebrate);
};
byId('edit').onclick=()=>{cancelAnimationFrame(confettiFrame);finished=false;update();render();byId('finish').focus();};
byId('restart').onclick=()=>{cancelAnimationFrame(confettiFrame);finished=false;activePiece=null;pieces=[];strokes=[];history=[];selection='ghost';update();render();byId('tray').firstElementChild.focus();};
byId('photo').onclick=()=>{
 cancelAnimationFrame(confettiFrame);render();
 canvas.toBlob(blob=>{
  if(!blob){byId('hint').textContent=words().error;return;}
  const url=URL.createObjectURL(blob);const link=document.createElement('a');
  link.href=url;link.download='momo-waffle.png';document.body.append(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);byId('hint').textContent=words().saved;
 },'image/png');
};
update();render();
</script></body></html>
