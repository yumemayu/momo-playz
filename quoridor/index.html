<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en-title="Quoridor | Momo.squirrels">コリドール | Momo.squirrels</title>
<script defer src="../game-catalog.js"></script>
<meta name="description" content="コマを進めて、かべで あいての道を ふさごう。先に むこう岸へ ついた方が勝ちの、ブラウザで遊べる無料ボードゲームです。">
<link rel="canonical" href="https://yumemayu.github.io/momo-fry-catch/quoridor/">
<link rel="stylesheet" href="../game.css?v=level-cards">
<link rel="stylesheet" href="../game-picker.css">
<link rel="stylesheet" href="../game-title-banner.css">
<link rel="stylesheet" href="../language.css">
<link rel="stylesheet" href="quoridor.css?v=shared-layout">
<script defer src="../language.js"></script>
<script defer src="../stickers.js"></script>
<script defer src="../nickname.js?v=compact"></script>
<script defer src="../scores.js?v=gem-rewards"></script>
<script defer src="quoridor.js"></script>
<link rel="stylesheet" href="../nickname.css?v=compact">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#f272a7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Quoridor">
  <link rel="apple-touch-icon" href="../icons/icon-512.png">
  <script defer src="../pwa.js?v=shared-toolbar"></script>
</head>
<body data-game="quoridor">
<main class="quoridor-main" data-board-layout data-game-toolbar>
  <div class="game-sidebar">
  <header class="game-heading game-title-banner">
    <span class="game-title-rainbow" aria-hidden="true">🌈</span>
    <span class="game-title-art" aria-hidden="true"></span>
    <h1><span data-en="Quoridor">コリドール</span></h1>
  </header>
  <div class="game-guide">
    <h2 data-en="How to play">あそびかた</h2>
    <ol>
      <li data-en="On your turn, move your piece or place a wall.">自分の番に、コマを進めるか、かべを置こう。</li>
      <li data-en="Leave a path open for both players.">かべを置いても、ふたりの道は残そう。</li>
      <li data-en="Reach the far side first!">先に向かいの端まで行けば勝ち！</li>
    </ol>
  </div>
  <fieldset class="difficulty">
    <legend data-en="Choose a level">レベルを えらぶ</legend>
    <div class="level-buttons" role="group" aria-label="レベル" data-en-label="Level">
      <button type="button" data-level="easy" aria-pressed="true"><svg class="level-art" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="24" r="11" fill="#ffe3ee" stroke="#a7195b" stroke-width="3"/><path d="M19 54c1-8 6-12 13-12s12 4 13 12z" fill="#f272a7" stroke="#a7195b" stroke-width="3"/><circle cx="28" cy="23" r="2" fill="#57344a"/><circle cx="36" cy="23" r="2" fill="#57344a"/><path d="M28.5 28.5q3.5 2.6 7 0" fill="none" stroke="#57344a" stroke-width="2.2" stroke-linecap="round"/></svg><span data-en="Easy">かんたん</span></button>
      <button type="button" data-level="normal" aria-pressed="false"><svg class="level-art" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="24" r="11" fill="#fff3d6" stroke="#a7195b" stroke-width="3"/><path d="M19 54c1-8 6-12 13-12s12 4 13 12z" fill="#ffb37e" stroke="#a7195b" stroke-width="3"/><circle cx="28" cy="23" r="2" fill="#57344a"/><circle cx="36" cy="23" r="2" fill="#57344a"/><path d="M28.5 28.5q3.5 2.6 7 0" fill="none" stroke="#57344a" stroke-width="2.2" stroke-linecap="round"/></svg><span data-en="Normal">ふつう</span></button>
      <button type="button" data-level="hard" aria-pressed="false"><svg class="level-art" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="24" r="11" fill="#e9e2ff" stroke="#a7195b" stroke-width="3"/><path d="M19 54c1-8 6-12 13-12s12 4 13 12z" fill="#b79ced" stroke="#a7195b" stroke-width="3"/><circle cx="28" cy="23" r="2" fill="#57344a"/><circle cx="36" cy="23" r="2" fill="#57344a"/><path d="M28.5 28.5q3.5 2.6 7 0" fill="none" stroke="#57344a" stroke-width="2.2" stroke-linecap="round"/></svg><span data-en="Hard">むずかしい</span></button>
    </div>
  </fieldset>
  <p id="instructions" data-en="You have 10 walls. You can't block every path — one must stay open.">壁は10枚まで。相手の道を全部ふさぐ置き方はできないよ。</p>
  <div class="music"><button id="sound" type="button" aria-pressed="true">おと ON</button></div>
  <section class="score-board" aria-labelledby="board-title">
    <div class="score-board-heading">
      <h2 id="board-title"><img src="../assets/game-cat.png" alt="" width="24" height="24"><span data-en="Leaderboard">ランキング</span></h2>
      <span id="score-level"></span>
      <div class="score-period" aria-label="Ranking period" role="group">
        <button type="button" data-period="weekly" aria-pressed="true" data-en="This week">今週</button>
        <button type="button" data-period="all" aria-pressed="false" data-en="All time">すべて</button>
      </div>
    </div>
    <p class="personal-best" id="personal-best"></p>
    <ol id="score-list"></ol>
  </section>
  </div>
  <div class="play-stack">
  <div class="play-hud">
  <div class="stats quoridor-stats">
      <span><span data-en="Your walls">あなたの かべ</span> <output id="walls-you">10</output></span>
      <span><span data-en="Rival walls">あいての かべ</span> <output id="walls-cat">10</output></span>
      <span><span data-en="Moves">てかず</span> <output id="moves">0</output></span>
    </div>
    <p class="turn-line" id="turn-line" role="status"></p>
  </div>
    <div class="play-stage">
      <div class="quoridor-board game-field" id="board" role="group" aria-label="ボード" data-en-label="Board"></div>
      <div class="game-card" id="ready-card">
        <img src="../assets/game-cat.png" alt="" width="58" height="58">
        <strong data-en="Ready to play?">はじめよう！</strong>
        <div class="player-setup">
          <label for="nickname" data-en="Nickname">ニックネーム</label>
          <input id="nickname" maxlength="20" placeholder="例：もち" data-en-placeholder="e.g. Mochi" autocomplete="off" aria-describedby="player-hint">
          <small id="player-hint" data-en="Enter a nickname to save your score on this device.">なまえを入れると、この端末にスコアが残るよ。</small>
        </div>
      </div>
    </div>
    <div class="game-card" id="score-card" role="status" aria-atomic="true" hidden>
      <span data-en="Score">スコア</span><strong id="final-score"></strong>
      <div class="quoridor-verdict" id="quoridor-verdict"></div>
      <p></p>
    </div>
    <button type="button" id="change-player" class="change-player" data-en="Change nickname" hidden>ニックネームをかえる</button>
    <div class="play-row">
      <button class="play-primary" id="start" type="button">Play</button>
      <button class="stop-button" id="stop" type="button" hidden>■ Stop</button>
    </div>
  </div>
  <nav class="game-picker" data-game-catalog aria-label="More Momo games"></nav>
</main>
<footer class="feedback"><a href="../sticker-book/" data-sticker-link>✦ Sticker Book</a><a href="https://clubs.place/f/fS6twrevaLxr9ZI38eKpOUpW" target="_blank" rel="noopener noreferrer" data-en="Send feedback">感想をおくる</a><small>Copyright Momo.squirrels</small></footer>
</body>
</html>
