<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cream Soda Shop · Momo Playz</title>
<script defer src="../game-catalog.js"></script>
  <meta name="description" content="Sort colorful cream sodas in this Momo Playz puzzle.">
  <meta name="theme-color" content="#f272a7">
  <meta name="apple-mobile-web-app-title" content="Cream Soda">
  <link rel="apple-touch-icon" href="../icons/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="../game.css?v=shared-toolbar">
  <link rel="stylesheet" href="../game-picker.css">
  <link rel="stylesheet" href="../game-title-banner.css">
  <link rel="stylesheet" href="../nickname.css?v=compact">
  <link rel="stylesheet" href="../language.css">
  <link rel="stylesheet" href="soda.css?v=common-home">
  <script defer src="../language.js"></script>
  <script defer src="../pwa.js?v=shared-toolbar"></script>
  <script defer src="../soda-gems.js"></script>
  <script defer src="../nickname.js?v=compact"></script>
  <script defer src="../scores.js?v=shared-toolbar"></script>
  <script defer src="soda.js?v=shared-ui"></script>
<style>
.soda-main[data-board-layout] .soda-board {
  display: flex;
  flex-direction: column;
}
.soda-board > .soda-counter {
  flex: none;
  margin-block: auto;
  padding-block-start: 7px;
}
.soda-counter > #message:empty { display: none; }
</style>
</head>
<body data-game="cream-soda" data-stage-rewards>
<main class="soda-main" data-board-layout data-game-toolbar>
<div class="game-sidebar">
  <header class="game-heading game-title-banner">
    <span class="game-title-rainbow" aria-hidden="true">🌈</span>
    <span class="soda-title-art" aria-hidden="true">🥤</span>
    <h1><span data-ja="クリームソーダ屋さん">Cream Soda Shop</span></h1>
  </header>
  <section class="game-guide" aria-labelledby="game-guide-title">
  <h2 id="game-guide-title" data-ja="あそびかた">How to play</h2>
  <ol>
    <li data-ja="注ぐグラスをタップ">Tap the glass to pour from.</li>
    <li data-ja="空か、上が同じ色のグラスをえらぶ">Tap an empty glass or one with the same top colour.</li>
    <li data-ja="ひとつのグラスに同じ色をそろえる">Sort each colour into its own glass.</li>
  </ol>
</section>
<fieldset class="difficulty">
    <legend data-ja="ステージをえらぶ">Choose a stage</legend>
    <select id="levels" aria-label="Stage" data-ja-label="ステージ"><option value="0">1 / 12</option></select>
  </fieldset>
  <section class="score-board" aria-labelledby="board-title">
    <div class="score-board-heading">
      <h2 id="board-title" data-ja="ランキング">Leaderboard</h2>
      <div class="score-period" aria-label="Ranking period" role="group">
        <button type="button" data-period="weekly" aria-pressed="true" data-ja="今週">This week</button>
        <button type="button" data-period="all" aria-pressed="false" data-ja="すべて">All time</button>
      </div>
    </div>
    <p id="personal-best" class="personal-best"></p>
    <ol id="score-list"></ol>
  </section>
  </div>
<div class="play-stack">
    <div class="play-hud" aria-hidden="true"></div>
    <div class="soda-board">
      <div class="soda-counter">
        <div class="awning" aria-hidden="true"></div>
        <div id="glasses" class="glasses"></div>
        <div id="celebration" hidden><img src="melon-soda.webp" alt="" width="180" height="180"></div>
        <p id="message" role="status"></p>
      </div>
    </div>
    <div class="actions soda-actions">
        <button id="undo" type="button" data-ja="ひとつ戻す">Undo</button>
        <button id="reset" type="button" data-ja="やりなおす">Restart</button>
        <button id="next" type="button" data-ja="つぎのステージ" hidden>Next stage</button>
      </div>
    <div id="score-card" class="game-card" role="status" hidden>
      <span data-ja="スコア">Score</span> <strong id="final-score"></strong>
      <p></p>
    </div>
    <div class="game-card" id="ready-card">
      <div class="player-setup">
        <label for="nickname" data-ja="ニックネーム（任意）">Nickname (optional)</label>
        <input id="nickname" maxlength="20" autocomplete="off">
      </div>
    </div>
    <button type="button" id="change-player" class="change-player" data-ja="ニックネームをかえる" hidden>Change nickname</button>
  </div>
<nav class="game-picker" data-game-catalog aria-label="More Momo games"></nav>
</main>
<footer class="feedback"><a href="../sticker-book/" data-sticker-link>✦ Sticker Book</a><a href="https://clubs.place/f/fS6twrevaLxr9ZI38eKpOUpW" target="_blank" rel="noopener noreferrer" data-en="Send feedback">感想をおくる</a><small>Copyright Momo.squirrels</small></footer>
</body>
</html>
