<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en-title="Mood Stars">きょうのきぶん星</title>
<script defer src="../game-catalog.js"></script>
  <link rel="stylesheet" href="../language.css">
  <link rel="stylesheet" href="../game.css?v=level-cards">
  <link rel="stylesheet" href="../game-picker.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&amp;display=swap">
  <link rel="stylesheet" href="mood-stars.css?v=round-colors">
  <script defer src="../language.js"></script>
  <script defer src="../pwa.js?v=shared-toolbar"></script>
  <script defer src="mood-stars.js?v=mood-prompt"></script>
</head>
<body data-game="mood-stars">
<main data-board-layout data-game-toolbar class="mood-page">
  <a class="momo-home-link" href="../" data-ja="ホーム">Home</a>
  <div class="music"><button id="star-sound" type="button" aria-pressed="false">Sound</button></div>
  <div class="game-sidebar">
    <header class="game-heading"><h1 data-ja="きょうのきぶん星">Mood Stars</h1></header>
    <section class="game-guide" aria-label="How to play" data-ja-label="あそびかた">
      <h2 data-ja="あそびかた">How to play</h2><ol>
      <li data-ja="気になる星をひとつ えらぶ">Pick a star.</li>
      <li data-ja="お話のあと、星にふれる">Touch the star after the story.</li>
      <li data-ja="ひかった順に星をおして、月までつなぐ">Tap in order to light the way to the moon.</li>
      </ol>
    </section>
  </div>
  <div class="play-stack">
    <div class="play-stage">
  <section class="mood-sky game-field" aria-labelledby="sky-title">
    <h2 id="sky-title">Ready to play?</h2>
    <p id="mood-story" hidden></p>
    <div id="mood-choices" class="mood-choices" inert>
      <button type="button" data-mood="excited" aria-pressed="false"><img src="rainbow.webp" alt=""></button>
      <button type="button" data-mood="happy" aria-pressed="false"><img src="rose.webp" alt=""></button>
      <button type="button" data-mood="sad" aria-pressed="false"><img src="blue.webp" alt=""></button>
      <button type="button" data-mood="dreamy" aria-pressed="false"><img src="crystal.webp" alt=""></button>
    </div>
    <button id="story-star" class="story-star" type="button" hidden>
      <span id="my-stars" class="my-stars" aria-hidden="true"></span>
      <span class="story-star-label" data-ja="星にふれてね">Touch the star</span>
    </button>
    <div id="star-trail" class="star-trail" hidden>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="trail-colors" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" class="trail-color-start" stop-color="#ff8cc8"/>
            <stop offset="54%" class="trail-color-middle" stop-color="#ffd6ea"/>
            <stop offset="100%" class="trail-color-end" stop-color="#ffa4dd"/>
          </linearGradient>
        </defs>
        <use class="trail-glow" href="#star-line"/>
        <path id="star-line" d=""/>
        <line id="moon-ray" x2="86" y2="16" pathLength="1"/>
        <g class="trail-dust">
          <circle r=".8">
            <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#star-line"/></animateMotion>
          </circle>
          <circle r=".55">
            <animateMotion dur="8s" begin="1.5s" repeatCount="indefinite"><mpath href="#star-line"/></animateMotion>
          </circle>
        </g>
      </svg>
      <div class="trail-twinkles" aria-hidden="true"><span>✧</span><span>✦</span><span>·</span><span>✧</span><span>✦</span></div>
      <svg class="constellation-art" viewBox="0 0 180 130" aria-hidden="true">
        <g data-picture="excited">
          <path d="M34 87 Q42 62 34 40 Q54 58 67 65 Q83 49 90 27 Q97 49 113 65 Q126 58 146 40 Q138 62 146 87 Q90 109 34 87Z"/>
          <path d="M43 83 Q90 98 137 83"/>
          <circle cx="34" cy="40" r="3"/><circle cx="90" cy="27" r="3"/><circle cx="146" cy="40" r="3"/>
        </g>
        <g data-picture="happy">
          <path d="M90 103 C73 89 37 72 37 47 C37 23 68 19 90 45 C112 19 143 23 143 47 C143 72 107 89 90 103Z"/>
          <path d="M47 49 Q48 37 59 35"/>
        </g>
        <g data-picture="sad">
          <path d="M96 22 A46 46 0 1 0 134 94 Q100 105 81 79 Q63 48 96 22Z"/>
          <path d="M122 26 Q124 40 137 42 Q124 44 122 57 Q120 44 107 42 Q120 40 122 26Z"/>
        </g>
        <g data-picture="dreamy">
          <path d="M90 66 C70 27 28 20 38 51 Q43 67 68 72 C38 72 46 105 66 100 Q83 96 90 76 C97 96 114 100 122 100 C142 105 142 72 112 72 Q137 67 142 51 C152 20 110 27 90 66Z"/>
          <path d="M90 65 Q86 55 79 51 M90 65 Q94 55 101 51 M90 66V81"/>
        </g>
      </svg>
      <span class="trail-moon" aria-hidden="true"><span class="moon-sparkles">✧　✦　✧</span></span>
      <div id="star-points"></div>
    </div>
    <p id="mood-message" class="mood-message" role="status"></p>
  </section>
    </div>
    <div class="mood-actions play-row">
    <button type="button" class="play-primary" id="play-stars">Play</button>
    <button type="button" id="show-stars" data-ja="お手本をもういちど" hidden>Show me again</button>
    <button type="button" id="pick-again" hidden>Back to the stars</button>
    </div>
  </div>
<nav class="game-picker" data-game-catalog aria-label="More Momo games"></nav>
</main>
<footer class="feedback">
  <a href="../" data-ja="ゲーム集">All games</a>
  <a href="https://clubs.place/f/fS6twrevaLxr9ZI38eKpOUpW" rel="noopener noreferrer" data-ja="感想をおくる">Send feedback</a>
  <small>Copyright Momo.squirrels</small>
</footer>
</body>
</html>
