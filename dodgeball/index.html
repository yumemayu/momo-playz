<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-en-title="Momo Dodgeball">Momo ドッジボール</title>
<link rel="stylesheet" href="../language.css">
<link rel="stylesheet" href="../game.css?v=level-cards">
<link rel="stylesheet" href="dodgeball.css?v=dodge-navigation">
<link rel="stylesheet" href="../game-title-banner.css">
<script defer src="../language.js"></script>
<script defer src="../nickname.js?v=compact"></script>
<script defer src="../stickers.js"></script>
<script defer src="../scores.js?v=shared-nickname"></script>
<script defer src="dodgeball.js?v=dodge-navigation"></script>
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#f272a7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Momo Playz">
  <link rel="apple-touch-icon" href="../icons/icon-512.png">
  <script defer src="../pwa.js"></script>
</head>
<body data-game="dodgeball">
<main>
  <header class="game-heading game-title-banner">
    <span class="game-title-rainbow" aria-hidden="true">🌈</span>
    <span class="game-title-art" aria-hidden="true"></span>
    <h1 data-ja="Momo ドッジボール">Momo Dodgeball</h1>
  </header>
  <a class="home-link" href="../" data-ja="← ゲーム集にもどる">← All games</a>
  <fieldset class="match-modes">
    <legend data-ja="あそびかた">Game mode</legend>
    <button type="button" data-mode="practice" data-level="practice" aria-pressed="false"><span data-ja="5球練習">5-shot practice</span></button>
    <button type="button" data-mode="match" data-level="match" aria-pressed="true"><span data-ja="ねこと対戦">Play against Cat</span></button>
  </fieldset>
  <div class="wide-bar"><button type="button" class="wide-btn" data-wide-btn aria-pressed="false">⛶ Bigger</button></div>
    <section class="court" aria-label="Dodgeball court" data-ja-label="ドッジボールコート">
    <div class="windows" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="floor" aria-hidden="true"></div>
    <div class="score"><span data-ja="ヒット">Hits</span> <strong id="hits">0</strong> <span aria-hidden="true">·</span> <span data-ja="のこり">Left</span> <strong id="left">5</strong><span id="cat-score" hidden> · <span data-ja="ねこ">Cat</span> <strong id="cat-hits">0</strong></span></div>
    <div class="opponent" aria-hidden="true">
      <img src="cat.webp" alt="" draggable="false">
      <img class="hit-face" data-face="squint" src="cat-squint.webp?v=catchlights" alt="" draggable="false">
      <img class="hit-face" data-face="surprised" src="cat-surprised.webp?v=catchlights" alt="" draggable="false">
      <img class="hit-face" data-face="dizzy" src="cat-dizzy.webp?v=catchlights" alt="" draggable="false">
      <div class="impact">
        <i class="glasses"></i>
        <div class="star-burst">
          <i class="spark">★</i><i class="spark">✦</i><i class="spark">★</i>
          <i class="spark">✧</i><i class="spark">★</i><i class="spark">✦</i>
        </div>
      </div>
      <span class="reaction" id="reaction" hidden></span>
    </div>
    <div class="aim" hidden aria-hidden="true"></div>
    <button id="ball" class="ball" type="button" aria-label="Throw the ball" data-ja-label="ボールを投げる" aria-describedby="guide"></button>
    <div id="dodge-zone" class="dodge-zone" hidden>
      <span id="dodge-cue" class="dodge-cue" aria-hidden="true"></span>
      <div id="landing" class="landing" aria-hidden="true"></div>
      <div id="paw-position" class="paw-position" aria-hidden="true">🐾</div>
      <button type="button" data-dodge="-1" aria-label="Dodge left" data-ja-label="左によける">‹</button>
      <button type="button" data-dodge="1" aria-label="Dodge right" data-ja-label="右によける">›</button>
    </div>
    <div id="finish" class="finish" hidden>
      <h2 id="result"></h2>
      <button type="button" id="retry" data-ja="もういちど">Play again</button>
    </div>
  </section>
  <p id="guide">Click the court where you want to throw. Keyboard: ← → to aim, Space to throw.</p>
  <p id="status" class="sr-only" role="status"></p>
  <div id="ready-card">
    <div class="player-setup">
      <label for="nickname" data-ja="ニックネーム（任意）">Nickname (optional)</label>
      <input id="nickname" maxlength="20" autocomplete="off">
    </div>
  </div>
  <button class="change-player" id="change-player" type="button" hidden data-ja="ニックネームをかえる">Change nickname</button>
  <div hidden><div id="score-card" hidden><strong id="final-score"></strong><p></p></div></div>
  <section class="score-board" aria-labelledby="board-title">
<div class="score-board-heading">
<h2 id="board-title"><span data-ja="ランキング">Leaderboard</span></h2>
<span id="score-level"></span>
<div class="score-period" aria-label="Ranking period" role="group">
<button type="button" data-period="weekly" aria-pressed="true" data-ja="今週">This week</button>
<button type="button" data-period="all" aria-pressed="false" data-ja="すべて">All time</button>
</div>
</div>
<p class="personal-best" id="personal-best"></p>
<ol id="score-list"></ol>
</section>
  <footer><a href="../sticker-book/" data-sticker-link>✦ Sticker Book</a>
<a href="https://clubs.place/f/fS6twrevaLxr9ZI38eKpOUpW" target="_blank" rel="noopener noreferrer" data-ja="感想をおくる">Send feedback</a></footer>
</main>
</body>
</html>
