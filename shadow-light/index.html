<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en-title="Shadow Light | Momo.squirrels">シャドーライト | Momo.squirrels</title>
<script defer src="../game-catalog.js"></script>
<meta name="description" content="光を当てたらどんな影ができるか当てる、空間認識のパズル。10問にチャレンジ。ブラウザで遊べる無料パズルゲームです。">
<link rel="canonical" href="https://yumemayu.github.io/momo-playz/shadow-light/">
<link rel="stylesheet" href="../game.css?v=shared-toolbar">
<link rel="stylesheet" href="../game-picker.css">
<link rel="stylesheet" href="../game-title-banner.css">
<link rel="stylesheet" href="../language.css">
<link rel="stylesheet" href="shadow-light.css?v=sun-direction">
<script defer src="../language.js"></script>
<script defer src="../stickers.js"></script>
<script defer src="../nickname.js?v=compact"></script>
<script defer src="../scores.js?v=gem-rewards"></script>
<script defer src="shadow-light.js?v=sun-direction"></script>
<link rel="stylesheet" href="../nickname.css?v=compact">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#f272a7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shadow Light">
  <link rel="apple-touch-icon" href="../icons/icon-512.png">
  <script defer src="../pwa.js?v=shared-toolbar"></script>
</head>
<body data-game="shadow-light">
<main class="sl-main" data-board-layout data-game-toolbar>
  <div class="game-sidebar">
  <header class="game-heading game-title-banner">
    <span class="game-title-rainbow" aria-hidden="true">🌈</span>
    <span class="game-title-art" aria-hidden="true"></span>
    <h1><span data-en="Shadow Light">シャドーライト</span></h1>
  </header>
    <section class="game-guide" aria-labelledby="game-guide-title">
      <h2 id="game-guide-title" data-en="How to play">あそびかた</h2>
      <ol>
        <li data-en="Look at the blocks and the light direction">積み木と光の向きを見る</li>
        <li data-en="Think about hidden blocks too">隠れた積み木の影も考える</li>
        <li data-en="Tap the matching shadow">正しい影をタップ</li>
      </ol>
    </section>
  <fieldset class="difficulty">
    <legend data-en="Choose a level">レベルを えらぶ</legend>
    <div class="level-buttons" role="group" aria-label="レベル" data-en-label="Level">
      <button type="button" data-level="easy" aria-pressed="false"><span class="level-icon" aria-hidden="true">🌼</span><span data-en="Easy">かんたん</span></button>
      <button type="button" data-level="normal" aria-pressed="true"><span class="level-icon" aria-hidden="true">🦋</span><span data-en="Normal">ふつう</span></button>
      <button type="button" data-level="hard" aria-pressed="false"><span class="level-icon" aria-hidden="true">⭐</span><span data-en="Hard">むずかしい</span></button>
    </div>
  </fieldset>
  <div class="music"><button id="sound" type="button" aria-pressed="true">おと ON</button></div>
  <section class="score-board" aria-labelledby="board-title">
    <div class="score-board-heading">
      <h2 id="board-title"><svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><circle cx="14" cy="13" r="7" fill="#ffb84d"/><polygon points="36,14 50,21 36,28 22,21" fill="#ffedb0" stroke="#c9a44a" stroke-width="1.6"/><polygon points="22,21 36,28 36,40 22,33" fill="#f2d67c" stroke="#c9a44a" stroke-width="1.6"/><polygon points="36,28 50,21 50,33 36,40" fill="#e0b95c" stroke="#c9a44a" stroke-width="1.6"/></svg><span data-en="Leaderboard">ランキング</span></h2>
      <span id="score-level"></span>
      <div class="score-period" aria-label="Ranking period" role="group">
        <button type="button" data-period="weekly" aria-pressed="true" data-en="This week">今週</button>
        <button type="button" data-period="all" aria-pressed="false" data-en="All time">すべて</button>
      </div>
    </div>
    <p class="personal-best" id="personal-best"></p>
    <ol id="score-list"></ol>
  </section>
  </div>
  <div class="play-stack">
    <div class="play-hud">
  <div class="stats sl-stats">
      <span><span data-en="Question">もんだい</span> <output id="qnum">1 / 10</output></span>
      <span><span data-en="Time">じかん</span> <output id="time">0</output><span data-en="s">秒</span></span>
    </div>
    <p class="turn-line" id="turn-line" role="status"></p>
    </div>
    <div class="play-stage">
      <div class="sl-board game-field preview" id="board">
        <div class="sl-blocks" id="blocks"></div>
        <div class="sl-answers" id="answers" role="group" aria-label="影" data-en-label="Shadows"></div>
      </div>
      <div class="game-card" id="ready-card">
        <svg width="58" height="58" viewBox="0 0 64 64" aria-hidden="true"><circle cx="14" cy="13" r="7" fill="#ffb84d"/><polygon points="36,14 50,21 36,28 22,21" fill="#ffedb0" stroke="#c9a44a" stroke-width="1.6"/><polygon points="22,21 36,28 36,40 22,33" fill="#f2d67c" stroke="#c9a44a" stroke-width="1.6"/><polygon points="36,28 50,21 50,33 36,40" fill="#e0b95c" stroke="#c9a44a" stroke-width="1.6"/><rect x="20" y="46" width="11" height="11" rx="2" fill="#57344a"/><rect x="33" y="42" width="11" height="15" rx="2" fill="#57344a"/></svg>
        <strong data-en="Ready to play?">はじめよう！</strong>
        <div class="player-setup">
          <label for="nickname" data-en="Nickname">ニックネーム</label>
          <input id="nickname" maxlength="20" placeholder="例：もち" data-en-placeholder="e.g. Mochi" autocomplete="off" aria-describedby="player-hint">
          <small id="player-hint" data-en="Enter a nickname to save your score on this device.">なまえを入れると、この端末にスコアが残るよ。</small>
        </div>
      </div>
    </div>
    <div class="game-card" id="score-card" role="status" aria-atomic="true" hidden>
      <span data-en="Score">スコア</span><strong id="final-score"></strong>
      <div class="sl-verdict" id="sl-verdict"></div>
      <p></p>
    </div>
    <button type="button" id="change-player" class="change-player" data-en="Change nickname" hidden>ニックネームをかえる</button>
    <div class="play-row">
      <button class="play-primary" id="start" type="button">Play</button>
      <button class="stop-button" id="stop" type="button" hidden>■ Stop</button>
    </div>
  </div>
  <nav class="game-picker" data-game-catalog aria-label="More Momo games"></nav>
</main>
<footer class="feedback"><a href="../sticker-book/" data-sticker-link>✦ Sticker Book</a><a href="https://clubs.place/f/fS6twrevaLxr9ZI38eKpOUpW" target="_blank" rel="noopener noreferrer" data-en="Send feedback">感想をおくる</a><small>Copyright Momo.squirrels</small></footer>
</body>
</html>
