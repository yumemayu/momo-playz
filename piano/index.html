<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Momo Piano</title>
<script defer src="../game-catalog.js"></script>
  <link rel="stylesheet" href="../game.css?v=level-cards">
  <link rel="stylesheet" href="piano.css?v=gingham-stage">
  <link rel="stylesheet" href="../game-picker.css">
<link rel="stylesheet" href="../language.css">
  <script defer src="../language.js"></script>
<script defer src="../nickname.js?v=compact"></script>
<link rel="stylesheet" href="../nickname.css?v=compact">
  <script defer src="../stickers.js"></script>
<script src="piano.js?v=gingham-stage" defer></script>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#f272a7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Momo Piano">
  <link rel="apple-touch-icon" href="../icons/icon-512.png">
  <script defer src="../pwa.js?v=sound-cue"></script>
</head>
<body>
<main id="momo-piano-levels" data-board-layout data-game-toolbar data-game-audio>
  <aside class="piano-sidebar game-sidebar">
    <header class="piano-title game-heading">
      <span aria-hidden="true">♫</span>
      <h1>Momo Piano</h1>
    </header>
    <div class="game-guide">
      <h2 data-ja="あそびかた">How to play</h2>
      <ol>
        <li data-ja="じゆうピアノでは、すきな鍵盤を押してみよう。">In Free Piano, tap any key to play a note.</li>
        <li data-ja="おてほんピアノでは、曲とレベルをえらぼう。">In Guided Piano, choose a song and a level.</li>
        <li data-ja="光る鍵盤を順番に押して、曲をひこう。">Follow the glowing keys to play the song.</li>
      </ol>
    </div>
      <div class="choices" role="group" aria-label="モードを えらぶ">
        <button type="button" class="choice free cursor-interaction" data-action="free" aria-pressed="true"><span aria-hidden="true">♫</span> <span data-copy="free">じゆうピアノ</span></button>
        <button type="button" class="choice guided cursor-interaction" data-action="songs" aria-pressed="false"><span aria-hidden="true">☆</span> <span data-copy="guided">おてほんピアノ</span></button>
      </div>
    <div class="level-buttons" role="group" aria-label="レベルを えらぶ" hidden></div>
  </aside>
  <div class="play-stack">
  <section class="phone play select-song" data-screen="songs" hidden aria-labelledby="momo-song-heading">
    <h2 id="momo-song-heading" data-copy="selectSong">きょくを えらぶ</h2>
    <div class="song-list"></div>
  </section>
  <section class="phone play" data-screen="playing" aria-labelledby="momo-current-song">
      <header><button type="button" class="back cursor-interaction" data-action="back" data-copy="back" hidden>‹ もどる</button><span class="mode"></span><button type="button" class="wide-btn" data-wide-btn aria-pressed="false">⛶ Bigger</button></header>
      <div class="song">
        <div class="sparkles" aria-hidden="true"><svg class="spark-small" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1c1.2 6.5 3 8.8 11 11-8 2.2-9.8 4.5-11 11C10 15.8 8.2 13.5 1 12 8.2 10.5 10 8.2 12 1z" fill="#c99ade"/></svg><svg class="spark-big" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4l6.6 13.9 15.2 1.9-11.1 10.5 2.8 15.1L24 38.3l-13.5 7.1 2.8-15.1L2.2 19.8l15.2-1.9z" fill="#f7bd45" stroke="#e09a26" stroke-width="2" stroke-linejoin="round"/></svg><svg class="spark-small" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1c1.2 6.5 3 8.8 11 11-8 2.2-9.8 4.5-11 11C10 15.8 8.2 13.5 1 12 8.2 10.5 10 8.2 12 1z" fill="#c99ade"/></svg></div>
        <h2 id="momo-current-song"></h2>
        <div class="track" role="progressbar" aria-label="曲の進み具合" aria-valuemin="0" aria-valuemax="42" aria-valuenow="0"><div></div></div>
        <p class="hint" aria-live="polite">ひかる「ド」を おしてね</p>
      </div>
      <div class="falling-roll" aria-hidden="true" hidden></div>
      <div class="piano" role="group" aria-label="ピアノの鍵盤">
        <div class="piano-row" role="group" aria-label="低い音">
          <span class="row-label" data-copy="lower">低い音</span>
          <div class="key-row lower-keys"></div>
        </div>
        <div class="piano-row" role="group" aria-label="高い音">
          <span class="row-label" data-copy="higher">高い音</span>
          <div class="key-row upper-keys"></div>
        </div>
      </div>
      <div class="celebration" hidden>
        <span aria-hidden="true"><svg class="spark-small" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1c1.2 6.5 3 8.8 11 11-8 2.2-9.8 4.5-11 11C10 15.8 8.2 13.5 1 12 8.2 10.5 10 8.2 12 1z" fill="#c99ade"/></svg><svg class="spark-big" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4l6.6 13.9 15.2 1.9-11.1 10.5 2.8 15.1L24 38.3l-13.5 7.1 2.8-15.1L2.2 19.8l15.2-1.9z" fill="#f7bd45" stroke="#e09a26" stroke-width="2" stroke-linejoin="round"/></svg><svg class="spark-small" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1c1.2 6.5 3 8.8 11 11-8 2.2-9.8 4.5-11 11C10 15.8 8.2 13.5 1 12 8.2 10.5 10 8.2 12 1z" fill="#c99ade"/></svg></span>
        <strong>クリアおめでとう！</strong>
        <small class="challenge-result" hidden></small>
      </div>
      <div class="play-footer">
        <span class="count"></span>
        <button class="reset cursor-interaction" data-copy="reset" type="button">はじめから</button>
      </div>
  </section>
  <details class="momo-nickname-panel" data-nickname-panel>
  <summary>Set nickname</summary>
  <form>
    <label for="shared-nickname" data-ja="ニックネーム">Nickname</label>
    <input id="shared-nickname" maxlength="20" autocomplete="off">
    <button type="submit" data-ja="保存">Save</button>
  </form>
  <small role="status"></small>
</details>
  </div>
  <nav class="game-picker" data-game-catalog aria-label="More Momo games"></nav>

</main>
<footer class="sticker-footer"><a href="../sticker-book/" data-sticker-link>✦ Sticker Book</a>
<a href="https://clubs.place/f/fS6twrevaLxr9ZI38eKpOUpW" target="_blank" rel="noopener noreferrer" data-ja="感想をおくる">Send feedback</a></footer>
</body>
</html>
