    <rect x="186" y="168" width="5" height="34" rx="2.5" fill="#57344a"/>
    <path d="M191 168 L214 175 L191 184 Z" fill="#ff5252"/>
  </g>
  <!-- mine peeking at the corner tile -->
  <g fill="#57344a">
    <circle cx="270" cy="270" r="15"/>
    <g stroke="#57344a" stroke-width="5" stroke-linecap="round">
      <line x1="270" y1="248" x2="270" y2="254"/>
      <line x1="270" y1="286" x2="270" y2="292"/>
      <line x1="248" y1="270" x2="254" y2="270"/>
      <line x1="286" y1="270" x2="292" y2="270"/>
    </g>
    <circle cx="264" cy="264" r="4" fill="#ffffff" opacity=".85"/>
  </g>
