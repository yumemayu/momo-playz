    <path d="M348 60 l3.5 8.5 L360 72 l-8.5 3.5 L348 84 l-3.5 -8.5 L336 72 l8.5 -3.5 Z"/>
  </g>
  <!-- panel -->
  <rect x="52" y="52" width="296" height="296" rx="36" fill="#f2fbf5"/>
  <!-- tile grid -->
  <g>
    <rect x="76" y="76" width="68" height="68" rx="12" fill="#34ce8b"/>
    <rect x="156" y="76" width="68" height="68" rx="12" fill="#fdf6ec" stroke="#f3e3d3" stroke-width="3"/>
    <rect x="236" y="76" width="68" height="68" rx="12" fill="#34ce8b"/>
    <rect x="76" y="156" width="68" height="68" rx="12" fill="#fdf6ec" stroke="#f3e3d3" stroke-width="3"/>
    <rect x="156" y="156" width="68" height="68" rx="12" fill="#34ce8b"/>
    <rect x="236" y="156" width="68" height="68" rx="12" fill="#fdf6ec" stroke="#f3e3d3" stroke-width="3"/>
    <rect x="76" y="236" width="68" height="68" rx="12" fill="#34ce8b"/>
    <rect x="156" y="236" width="68" height="68" rx="12" fill="#fdf6ec" stroke="#f3e3d3" stroke-width="3"/>
    <rect x="236" y="236" width="68" height="68" rx="12" fill="#34ce8b"/>
  </g>
  <!-- numbers -->
  <g font-family="Arial, sans-serif" font-weight="900" font-size="38" text-anchor="middle">
    <text x="190" y="122" fill="#4fa3ff">1</text>
    <text x="110" y="202" fill="#34b06b">2</text>
    <text x="270" y="202" fill="#4fa3ff">1</text>
    <text x="190" y="282" fill="#ff6482">3</text>
